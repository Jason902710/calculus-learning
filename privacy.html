<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>觀看紀錄說明｜循理</title><link rel="stylesheet" href="admin.css"></head><body><main><a href="./">← 返回學習室</a><h1>你的學習紀錄</h1><p>不登入仍可閱覽公開教材。Google 登入後，網站保存帳號識別碼、顯示名稱、完成標記、MP4 播放位置與更新時間，用於跨裝置接續學習及授課進度統計。</p><p>只有你與指定授課管理者可以查看你的進度，其他學生不能讀取。Google 密碼不會交給網站。</p><p>YouTube 目前只記錄你自行勾選的完成標記，不自動追蹤播放時長。MP4 播放位置與完成標記也不代表總觀看時長或已理解課程。</p><p>如需刪除帳號及學習紀錄，請聯絡授課老師。登出不會刪除雲端紀錄。</p></main></body></html>
