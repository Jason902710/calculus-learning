<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者工作室｜循理</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js" defer></script><script src="auth-config.js" defer></script><script src="account.js" defer></script><script src="admin.js" defer></script></head><body><header><a href="./">← 返回學習室</a><span>循理 · 管理者工作室</span></header><main><div class="eyebrow">TEACHER WORKSPACE</div><h1>教材與學習進度</h1><section><h2>Google 帳號登入</h2><p id="identity" data-account-status>正在確認登入服務…</p><button id="google-login" disabled>使用 Google 登入</button><button id="logout" class="secondary" hidden>登出</button><p id="setup-note">Google 登入尚待啟用。現有教材可正常閱覽；此頁已停止接收 GitHub 管理金鑰。</p><p><a href="login-setup.html">網站擁有者：完成 Google 登入設定 ↗</a></p></section><section id="workspace" hidden><h2>教材管理</h2><form id="upload-form"><div class="fields"><label>課程位置<select id="slot"></select></label><label>教材分類<select id="kind"><option value="hand">必交作業</option><option value="practice">自主練習</option><option value="original">老師原始作業</option><option value="notes">講義／補充教材</option></select></label></div><label>教材名稱<input id="title" maxlength="100" required></label><label>PDF（上限 20 MB）<input id="file" type="file" accept=".pdf,application/pdf" required></label><p class="muted">發布後所有訪客可閱覽；相同位置與分類會更換原教材。</p><button type="submit">上傳並發布</button></form><div id="file-list"></div><p class="muted">移除既有教材會隱藏網站連結，GitHub 原檔及歷史仍保留。新上傳 PDF 移除時也會刪除後端檔案。</p></section><section id="dashboard" hidden><div class="bar"><h2>學生進度</h2><button id="refresh" class="secondary">重新整理</button></div><p class="muted">完成數為學生自行勾選，MP4 播放位置不等同觀看時長。YouTube 目前沒有自動播放追蹤。</p><div id="students"></div></section><p id="status" role="status" aria-live="polite"></p><a href="privacy.html">觀看紀錄說明</a></main></body></html>
